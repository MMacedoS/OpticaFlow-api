name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: opticaflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opticaflow
      JWT_SECRET: ci-secret
      JWT_EXPIRATION: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_REFRESH_EXPIRATION: 7d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npx eslint "{src,test}/**/*.ts"
      - name: Build
        run: npm run build
      - name: Testes unitarios
        run: npm test
      - name: Migrations e seed
        run: npm run db:migrate:prod && npm run db:seed:prod
      - name: Testes e2e
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem de producao
        run: docker build -f Dockerfile.prod -t opticaflow-api .
