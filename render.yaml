# Blueprint do Render: New > Blueprint e aponte para este repositorio.
# Cria o PostgreSQL, a API e o frontend (site estatico, vindo do repositorio
# opticalFlow-APP). A API recebe a URL interna do banco automaticamente.
databases:
  - name: opticaflow-db
    databaseName: opticaflow
    user: opticaflow
    plan: free
    region: virginia
    postgresMajorVersion: "17"

services:
  - type: web
    name: opticaflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile.prod
    plan: free
    region: virginia
    branch: master
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opticaflow-db
          property: connectionString
      # URL publica do frontend, ex.: https://opticaflow-web.onrender.com
      # (varias separadas por virgula)
      - key: FRONTEND_URL
        sync: false
      - key: SEED_SUPER_ADMIN_EMAIL
        sync: false
      - key: SEED_SUPER_ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: SWAGGER_ENABLED
        value: "true"
      # Fuso usado para "hoje" (dashboard, numero da OS, vencimentos)
      - key: TZ
        value: America/Sao_Paulo
      # Roda o seed ao iniciar: deixe true so no primeiro deploy e depois
      # mude para false, porque o seed redefine a senha do superadmin.
      - key: RUN_SEED
        value: "true"

  - type: web
    name: opticaflow-web
    runtime: static
    repo: https://github.com/MMacedoS/opticalFlow-APP
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Rotas do React: qualquer caminho serve o index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # URL publica da API, ex.: https://opticaflow-api.onrender.com
      # (usada no build; ao alterar, faca um novo deploy do frontend)
      - key: VITE_API_URL
        sync: false
